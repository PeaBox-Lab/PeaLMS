[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-lms"
version = "0.1.0"
description = "Corporate learning management system MVP with guarded HRIS provisioning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Corporate LMS contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
corporate-lms = "lms.server:main"

[tool.setuptools]
packages = ["lms"]
include-package-data = true

[tool.setuptools.package-data]
lms = ["static/*.html", "static/*.css", "static/*.js"]

services:
  lms:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LMS_HOST: 0.0.0.0
      LMS_PORT: 8080
      LMS_DB_PATH: /app/data/lms.db
      # Demo impersonation is opt-in and never enabled in the shipped stack.
      LMS_DEMO_MODE: "false"
    volumes:
      - lms-data:/app/data
    restart: unless-stopped
volumes:
  lms-data:
